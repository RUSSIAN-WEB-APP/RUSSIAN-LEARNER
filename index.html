<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#58cc02">
  <meta name="description" content="Russian Learner — an adaptive Russian study app built around your own vocabulary.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Russian Learner</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">Р</div>
        <div>
          <strong>Russian Learner</strong>
          <span>Personal adaptive course</span>
        </div>
      </div>
      <nav class="nav" id="main-nav">
        <button data-route="home" class="nav-item active"><span>⌂</span> Home</button>
        <button data-route="learn" class="nav-item"><span>▶</span> Learn</button>
        <button data-route="review" class="nav-item"><span>↻</span> Review</button>
        <button data-route="flashcards" class="nav-item"><span>🃏</span> Flashcards</button>
        <button data-route="phrases" class="nav-item"><span>💬</span> Phrase Lab</button>
        <button data-route="speak" class="nav-item"><span>🎤</span> Speak</button>
        <button data-route="stories" class="nav-item"><span>📖</span> Read &amp; Listen</button>
        <button data-route="vocabulary" class="nav-item"><span>☷</span> Vocabulary</button>
        <button data-route="leaderboard" class="nav-item"><span>🏆</span> League</button>
        <button data-route="achievements" class="nav-item"><span>🏅</span> Achievements</button>
        <button data-route="progress" class="nav-item"><span>◔</span> Progress</button>
        <button data-route="settings" class="nav-item"><span>⚙</span> Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="mini-stat"><span>🔥</span><strong id="side-streak">0</strong><small>day streak</small></div>
        <div class="mini-stat"><span>⚡</span><strong id="side-xp">0</strong><small>XP today</small></div>
        <button id="auth-side-btn" class="outline-btn full">Sign in</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-btn" aria-label="Open menu">☰</button>
        <div class="top-title" id="top-title">Home</div>
        <div class="top-actions">
          <div class="pill"><span>🔥</span><strong id="top-streak">0</strong></div>
          <div class="pill"><span>💎</span><strong id="top-gems">0</strong></div>
          <div class="pill"><span>⚡</span><strong id="top-xp">0</strong></div>
          <button class="avatar-btn" id="profile-btn" aria-label="Profile">RU</button>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <div class="modal" id="auth-modal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" data-close="auth-modal">×</button>
      <div class="auth-brand">Р</div>
      <h2 id="auth-title">Welcome back</h2>
      <p class="muted" id="auth-subtitle">Sign in to sync your Russian learning progress across devices.</p>
      <form id="auth-form">
        <label>Email <input id="auth-email" type="email" required autocomplete="email"></label>
        <label><span id="auth-password-label">Password</span><input id="auth-password" type="password" required minlength="6" autocomplete="current-password"></label>
        <div id="auth-confirm-wrap" class="hidden"><label>Confirm password <input id="auth-confirm" type="password" minlength="6" autocomplete="new-password"></label></div>
        <button class="primary-btn full" type="submit" id="auth-submit">Sign in</button>
      </form>
      <div class="auth-links">
        <button class="text-btn" id="auth-switch">Create account</button>
        <button class="text-btn" id="auth-local">Use local mode</button>
      </div>
      <p class="tiny muted" id="auth-note">Local mode stays on this browser. Cloud mode uses your Supabase project.</p>
    </div>
  </div>

  <div class="modal" id="word-modal" aria-hidden="true">
    <div class="modal-card wide">
      <button class="modal-close" data-close="word-modal">×</button>
      <h2 id="word-modal-title">Add vocabulary</h2>
      <form id="word-form" class="form-grid">
        <label>Russian <input id="word-russian" required maxlength="500" placeholder="например: нужно"></label>
        <label>English meaning <input id="word-english" required maxlength="500" placeholder="e.g. need / necessary"></label>
        <label>Topic <input id="word-category" maxlength="80" value="General" placeholder="e.g. Travel"></label>
        <label>Type <select id="word-type"><option value="word">Word</option><option value="phrase">Phrase</option><option value="sentence">Sentence</option></select></label>
        <label class="span-2">Example or note <textarea id="word-notes" rows="3" placeholder="Example: Мне нужно учиться."></textarea></label>
        <div class="modal-actions span-2"><button type="button" class="secondary-btn" data-close="word-modal">Cancel</button><button class="primary-btn" type="submit">Save vocabulary</button></div>
      </form>
    </div>
  </div>

  <div class="modal" id="profile-modal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" data-close="profile-modal">×</button>
      <div class="profile-head"><div class="big-avatar" id="profile-avatar">RU</div><div><h2 id="profile-name">Learner</h2><p id="profile-email" class="muted"></p></div></div>
      <div class="profile-menu">
        <button id="profile-settings">Settings</button>
        <button id="profile-auth">Sign in / Account</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
